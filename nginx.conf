server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache policy
    location ~* \.(jpg|jpeg|png|gif|svg|ico|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Static files
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Proxy status API
    location /api/ {
        proxy_pass http://noix-status-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
